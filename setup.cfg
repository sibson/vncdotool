[metadata]
name = vncdotool
version = attr: vncdotool.__version__
url = http://github.com/sibson/vncdotool
author = Marc Sibson
author_email = sibson+vncdotool@gmail.com
description = Command line VNC client
long_description = file: README.rst, CHANGELOG.rst
keywords = VNC, RFB
python_requires = >=3.10
license = MIT License
license_files = LICENSE.txt
classifiers =
	Development Status :: 5 - Production/Stable
	Environment :: Console
	Framework :: Twisted
	Intended Audience :: Developers
	Intended Audience :: System Administrators
	License :: OSI Approved :: MIT License
	Operating System :: MacOS :: MacOS X
	Operating System :: Microsoft :: Windows
	Operating System :: POSIX
	Programming Language :: Python
        Programming Language :: Python :: 3.10
        Programming Language :: Python :: 3.11
        Programming Language :: Python :: 3.12
        Programming Language :: Python :: 3.13
	Topic :: Multimedia :: Graphics :: Viewers
	Topic :: Software Development :: Testing

[options]
zip_safe = True
packages =
	vncdotool
install_requires =
	Twisted
	Pillow
	cryptography

[flake8]
max-line-length = 127
extend-ignore = E203

[coverage:run]
branch = True
# Most of the data arrives from `vncdo` subprocesses, each writing its own
# file; see DEVELOP.rst.
parallel = True
patch = subprocess
concurrency = thread
source = vncdotool
relative_files = True

[coverage:paths]
# CI installs editable, so both spellings are the same checkout.
source =
	vncdotool
	*/site-packages/vncdotool

[coverage:report]
show_missing = True
exclude_also =
	if TYPE_CHECKING:
	raise NotImplementedError

[options.entry_points]
console_scripts =
	vncdo = vncdotool.command:vncdo
	vncdotool = vncdotool.command:vncdo
	vnclog = vncdotool.command:vnclog
	vncdo-replay = vncdotool.command:vncdo_replay
