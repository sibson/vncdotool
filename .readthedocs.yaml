# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

sphinx:
  configuration: docs/conf.py

# docs/conf.py reads the version from the installed distribution's metadata.
python:
  install:
    - method: pip
      path: .
      extra_requirements: []
