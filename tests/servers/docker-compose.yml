# Docker Compose set of small, version-controlled Linux VNC servers used
# as a compatibility test bed for vncdotool. See tests/servers/servers.mk for
# the make targets that drive this file and tests/functional/test_servers.py
# for the tests that exercise it.
#
# Every service is a stage of the shared tests/servers/Dockerfile, so the
# images differ only by the server they install. The two TigerVNC services
# are the same image twice, distinguished purely by VNC_PASSWORD -- naming
# the built image keeps that a single build rather than two. The build
# context is tests/, not tests/servers/, so the Dockerfile can also pull in
# the committed scene PNGs from tests/goldens/scenes/.
#
# Readiness is the HEALTHCHECK baked into the image, which makes
# `up --wait` a reliable barrier. Every service publishes its RFB port to
# localhost only.

name: vncdo-test-servers

services:
  # A small framebuffer keeps a committed Raw update to tens of kilobytes
  # rather than megabytes; see specs/decoder-goldens.md.
  tigervnc:
    build:
      context: ..
      dockerfile: servers/Dockerfile
      target: tigervnc
    image: ${FLEET_IMAGE_PREFIX:-vncdotool-test}-tigervnc:${FLEET_TAG:-dev}
    environment:
      VNC_GEOMETRY: 256x192
    ports:
      - "127.0.0.1:5931:5900"

  tigervnc-auth:
    build:
      context: ..
      dockerfile: servers/Dockerfile
      target: tigervnc
    image: ${FLEET_IMAGE_PREFIX:-vncdotool-test}-tigervnc:${FLEET_TAG:-dev}
    environment:
      VNC_PASSWORD: vncdotool
    ports:
      - "127.0.0.1:5932:5900"

  x11vnc:
    build:
      context: ..
      dockerfile: servers/Dockerfile
      target: x11vnc
    image: ${FLEET_IMAGE_PREFIX:-vncdotool-test}-x11vnc:${FLEET_TAG:-dev}
    ports:
      - "127.0.0.1:5933:5900"

  # Event sink, not a smoke target: prints events, renders no desktop.
  # Used by tests/functional/test_events.py.
  vncev:
    build:
      context: ..
      dockerfile: servers/Dockerfile
      target: vncev
    image: ${FLEET_IMAGE_PREFIX:-vncdotool-test}-vncev:${FLEET_TAG:-dev}
    ports:
      - "127.0.0.1:5934:5900"

  # LibVNCServer's "example" demo, replacing the old libvncserver.mk build.
  libvncserver-example:
    build:
      context: ..
      dockerfile: servers/Dockerfile
      target: libvncserver-example
    image: ${FLEET_IMAGE_PREFIX:-vncdotool-test}-libvncserver-example:${FLEET_TAG:-dev}
    ports:
      - "127.0.0.1:5935:5900"
