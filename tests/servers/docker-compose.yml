# The TigerVNC services share one image name, so the image builds once rather
# than once per service. The build context is tests/, not tests/servers/, so
# the Dockerfile can also pull in the committed scene PNGs from
# tests/goldens/scenes/.

name: vncdo-test-servers

services:
  # Small geometry keeps a committed Raw update in the tens of KB rather
  # than MB; see specs/decoder-goldens.md.
  tigervnc:
    build:
      context: ..
      dockerfile: servers/Dockerfile
      target: tigervnc
    image: ${FLEET_IMAGE_PREFIX:-vncdotool-test}-tigervnc:${FLEET_TAG:-dev}
    environment:
      VNC_GEOMETRY: 256x192
    ports:
      - "127.0.0.1:5931:5900"

  tigervnc-auth:
    build:
      context: ..
      dockerfile: servers/Dockerfile
      target: tigervnc
    image: ${FLEET_IMAGE_PREFIX:-vncdotool-test}-tigervnc:${FLEET_TAG:-dev}
    environment:
      VNC_PASSWORD: vncdotool
    ports:
      - "127.0.0.1:5932:5900"

  tigervnc-vencrypt:
    build:
      context: ..
      dockerfile: servers/Dockerfile
      target: tigervnc
    image: ${FLEET_IMAGE_PREFIX:-vncdotool-test}-tigervnc:${FLEET_TAG:-dev}
    environment:
      VNC_GEOMETRY: 256x192
      VNC_PASSWORD: vncdotool
      VNC_SECURITY_TYPES: X509Vnc,X509None,TLSVnc,TLSNone
      VNC_X509_DIR: /certs
    volumes:
      - ./vencrypt-certs:/certs
    ports:
      - "127.0.0.1:5941:5900"

  tigervnc-vencrypt-anon:
    build:
      context: ..
      dockerfile: servers/Dockerfile
      target: tigervnc
    image: ${FLEET_IMAGE_PREFIX:-vncdotool-test}-tigervnc:${FLEET_TAG:-dev}
    environment:
      VNC_GEOMETRY: 256x192
      VNC_PASSWORD: vncdotool
      VNC_SECURITY_TYPES: TLSVnc,TLSNone
    ports:
      - "127.0.0.1:5951:5900"

  wayvnc:
    build:
      context: ..
      dockerfile: servers/Dockerfile
      target: wayvnc
    image: ${FLEET_IMAGE_PREFIX:-vncdotool-test}-wayvnc:${FLEET_TAG:-dev}
    environment:
      VNC_GEOMETRY: 1024x768
      VNC_USERNAME: vncdotool
      VNC_PASSWORD: vncdotool
    volumes:
      - ./wayvnc-certs:/certs
    ports:
      - "127.0.0.1:5952:5900"

  x11vnc:
    build:
      context: ..
      dockerfile: servers/Dockerfile
      target: x11vnc
    image: ${FLEET_IMAGE_PREFIX:-vncdotool-test}-x11vnc:${FLEET_TAG:-dev}
    ports:
      - "127.0.0.1:5933:5900"

  # Event sink, not a smoke target: prints events, renders no desktop.
  vncev:
    build:
      context: ..
      dockerfile: servers/Dockerfile
      target: vncev
    image: ${FLEET_IMAGE_PREFIX:-vncdotool-test}-vncev:${FLEET_TAG:-dev}
    ports:
      - "127.0.0.1:5934:5900"

  websockify:
    build:
      context: ..
      dockerfile: servers/Dockerfile
      target: websockify
    image: ${FLEET_IMAGE_PREFIX:-vncdotool-test}-websockify:${FLEET_TAG:-dev}
    command: ["tigervnc:5900"]
    ports:
      - "127.0.0.1:5942:5900"

  websockify-tls:
    build:
      context: ..
      dockerfile: servers/Dockerfile
      target: websockify
    image: ${FLEET_IMAGE_PREFIX:-vncdotool-test}-websockify:${FLEET_TAG:-dev}
    command: ["tigervnc:5900"]
    environment:
      WEBSOCKIFY_TLS: "1"
    ports:
      - "127.0.0.1:5943:5900"

  qemu:
    build:
      context: ..
      dockerfile: servers/Dockerfile
      target: qemu
    image: ${FLEET_IMAGE_PREFIX:-vncdotool-test}-qemu:${FLEET_TAG:-dev}
    ports:
      - "127.0.0.1:5944:5900"

  qemu-tls:
    build:
      context: ..
      dockerfile: servers/Dockerfile
      target: qemu
    image: ${FLEET_IMAGE_PREFIX:-vncdotool-test}-qemu:${FLEET_TAG:-dev}
    environment:
      QEMU_VNC_TLS: "1"
    volumes:
      - ./qemu-tls:/tls
    ports:
      - "127.0.0.1:5945:5900"

  selenoid:
    build:
      context: ..
      dockerfile: servers/Dockerfile
      target: selenoid
    image: ${FLEET_IMAGE_PREFIX:-vncdotool-test}-selenoid:${FLEET_TAG:-dev}
    environment:
      VNC_GEOMETRY: 256x192
    ports:
      - "127.0.0.1:5946:4444"

  kasmvnc:
    build:
      context: ..
      dockerfile: servers/Dockerfile
      target: kasmvnc
    image: ${FLEET_IMAGE_PREFIX:-vncdotool-test}-kasmvnc:${FLEET_TAG:-dev}
    environment:
      VNC_GEOMETRY: 256x192
    ports:
      - "127.0.0.1:5947:5900"

  libvncserver-example:
    build:
      context: ..
      dockerfile: servers/Dockerfile
      target: libvncserver-example
    image: ${FLEET_IMAGE_PREFIX:-vncdotool-test}-libvncserver-example:${FLEET_TAG:-dev}
    ports:
      - "127.0.0.1:5935:5900"
