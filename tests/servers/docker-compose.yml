# See tests/servers/servers.mk for the make targets that drive this file and
# tests/functional/test_servers.py for the tests that exercise it.
#
# The two TigerVNC services differ only by VNC_PASSWORD but share one image
# name, so they build once rather than twice. The build context is tests/,
# not tests/servers/, so the Dockerfile can also pull in the committed scene
# PNGs from tests/goldens/scenes/.

name: vncdo-test-servers

services:
  # Small geometry keeps a committed Raw update in the tens of KB rather
  # than MB; see specs/decoder-goldens.md.
  tigervnc:
    build:
      context: ..
      dockerfile: servers/Dockerfile
      target: tigervnc
    image: ${FLEET_IMAGE_PREFIX:-vncdotool-test}-tigervnc:${FLEET_TAG:-dev}
    environment:
      VNC_GEOMETRY: 256x192
    ports:
      - "127.0.0.1:5931:5900"

  tigervnc-auth:
    build:
      context: ..
      dockerfile: servers/Dockerfile
      target: tigervnc
    image: ${FLEET_IMAGE_PREFIX:-vncdotool-test}-tigervnc:${FLEET_TAG:-dev}
    environment:
      VNC_PASSWORD: vncdotool
    ports:
      - "127.0.0.1:5932:5900"

  x11vnc:
    build:
      context: ..
      dockerfile: servers/Dockerfile
      target: x11vnc
    image: ${FLEET_IMAGE_PREFIX:-vncdotool-test}-x11vnc:${FLEET_TAG:-dev}
    ports:
      - "127.0.0.1:5933:5900"

  # Event sink, not a smoke target: prints events, renders no desktop.
  # Used by tests/functional/test_events.py.
  vncev:
    build:
      context: ..
      dockerfile: servers/Dockerfile
      target: vncev
    image: ${FLEET_IMAGE_PREFIX:-vncdotool-test}-vncev:${FLEET_TAG:-dev}
    ports:
      - "127.0.0.1:5934:5900"

  # LibVNCServer's "example" demo, replacing the old libvncserver.mk build.
  libvncserver-example:
    build:
      context: ..
      dockerfile: servers/Dockerfile
      target: libvncserver-example
    image: ${FLEET_IMAGE_PREFIX:-vncdotool-test}-libvncserver-example:${FLEET_TAG:-dev}
    ports:
      - "127.0.0.1:5935:5900"
