name: VNCDotool CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_PYTHON_VERSION_WARNING: '1'

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: [ubuntu-latest] #, windows-latest] tests fail on windows
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unittests
        run: python -m unittest discover tests/unit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8
        run: flake8 --count --statistics vncdotool tests

  servers:
    name: Test server functional tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VNCDOTOOL_SCREENSHOT_DIR: screenshots
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # The functional suite shells out to `vncdo`, so it has to be on PATH.
          pip install -e .

      - name: Build and start the VNC test servers
        run: docker compose -f tests/servers/docker-compose.yml up -d --build --wait

      # The steps below are diagnostics and teardown, so they carry
      # `if: always()`: when a test fails, the container status, the
      # screenshot of what the server was actually showing, and the server
      # logs are exactly what's needed to debug it -- skipping them on
      # failure would throw away the evidence. `down` likewise has to run
      # whatever happened.
      - name: Show test server status
        if: always()
        run: docker compose -f tests/servers/docker-compose.yml ps

      - name: Run functional tests
        run: python -m unittest discover -v -s tests/functional -t .

      - name: Capture screenshots and build the gallery
        if: always()
        timeout-minutes: 3
        run: python tests/functional/capture_screenshots.py

      - name: Dump test server container logs
        if: always()
        run: docker compose -f tests/servers/docker-compose.yml logs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Stop the VNC test servers
        if: always()
        run: docker compose -f tests/servers/docker-compose.yml down
