name: VNCDotool CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: [ubuntu-latest] #, windows-latest] tests fail on windows
        python-version: ['3.10', '3.11', '3.12', '3.13']
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run unittests
        run: uv run coverage run --parallel-mode -m unittest discover tests/unit

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit-${{ matrix.python-version }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: ignore

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run flake8
        run: uv run flake8 --count --statistics vncdotool tests

  mypy:
    name: Type check (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      # Report-only: capture mypy's exit status without letting it fail the
      # step, so this job stays green while the error count comes down over
      # subsequent PRs. `set +e` (rather than `|| true` on the pipeline)
      # keeps PIPESTATUS pointing at mypy, not at a trailing command.
      - name: Run mypy
        run: |
          set +e
          uv run mypy vncdotool tests | tee mypy.log
          echo "MYPY_EXIT_CODE=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
          exit 0

      - name: Summarize mypy results
        if: always()
        run: |
          {
            echo "## mypy (advisory, does not fail CI)"
            echo
            if [ "$MYPY_EXIT_CODE" = "0" ]; then
              echo "No errors."
            else
              tail -n 1 mypy.log
            fi
            echo
            echo "<details><summary>Full output</summary>"
            echo
            echo '```'
            cat mypy.log
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  servers:
    name: Test server functional tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      VNCDOTOOL_SCREENSHOT_DIR: screenshots
      FLEET_IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/vncdotool-test
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Resolve the fleet image tag
        run: echo "FLEET_TAG=$(git rev-parse HEAD:tests/servers)" >> "$GITHUB_ENV"

      - name: Fetch or build the VNC test servers
        run: |
          if docker compose -f tests/servers/docker-compose.yml pull --quiet; then
            echo "FLEET_IMAGES_BUILT=false" >> "$GITHUB_ENV"
          else
            docker compose -f tests/servers/docker-compose.yml build
            echo "FLEET_IMAGES_BUILT=true" >> "$GITHUB_ENV"
          fi
          docker compose -f tests/servers/docker-compose.yml up -d --wait

      - name: Wait for the test servers to serve their screens
        timeout-minutes: 5
        run: uv run python tests/functional/wait_for_servers.py docker

      # The steps below are diagnostics and teardown, so they carry
      # `if: always()`: when a test fails, the container status, the
      # screenshot of what the server was actually showing, and the server
      # logs are exactly what's needed to debug it -- skipping them on
      # failure would throw away the evidence. `down` likewise has to run
      # whatever happened.
      - name: Show test server status
        if: always()
        run: docker compose -f tests/servers/docker-compose.yml ps

      - name: Run functional tests
        run: uv run coverage run --parallel-mode -m unittest discover -v -s tests/functional -t .

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-fleet
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Capture screenshots and build the gallery
        if: always()
        timeout-minutes: 3
        run: uv run python tests/functional/capture_screenshots.py

      - name: Dump test server container logs
        if: always()
        run: docker compose -f tests/servers/docker-compose.yml logs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Stop the VNC test servers
        if: always()
        run: docker compose -f tests/servers/docker-compose.yml down --timeout 2

      # Last, and without `if: always()`: a fleet reaches the registry only
      # after passing the suite it exists to serve.
      - name: Log in to GHCR
        if: env.FLEET_IMAGES_BUILT == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the fleet images
        if: env.FLEET_IMAGES_BUILT == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker compose -f tests/servers/docker-compose.yml push
          {
            echo "Published \`$FLEET_TAG\`:"
            echo
            docker compose -f tests/servers/docker-compose.yml config --images | sort -u | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, servers]
    # Runs on a red build too, so a failing suite still reports what it
    # reached before it stopped.
    if: always()
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Download unit tier coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-unit-*
          path: data/unit
          merge-multiple: true

      - name: Download fleet tier coverage data
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-fleet
          path: data/fleet

      - name: Report
        run: |
          uv run .github/scripts/coverage-summary.sh unit=data/unit fleet=data/fleet
          cat combined/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the annotated HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          if-no-files-found: ignore

      - name: Upload unit coverage to Codecov
        if: always() && env.CODECOV_TOKEN != ''
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          files: combined/xml/unit.xml
          flags: unit
          disable_search: true
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload fleet coverage to Codecov
        if: always() && env.CODECOV_TOKEN != ''
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          files: combined/xml/fleet.xml
          flags: fleet
          disable_search: true
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
