name: VNCDotool CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_PYTHON_VERSION_WARNING: '1'

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: [ubuntu-latest] #, windows-latest] tests fail on windows
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt 'coverage>=7'

      - name: Run unittests
        run: coverage run --parallel-mode -m unittest discover tests/unit

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit-${{ matrix.python-version }}
          path: .coverage.*
          # The data files are dotfiles, which upload-artifact skips by
          # default -- without this the coverage job silently sees nothing.
          include-hidden-files: true
          if-no-files-found: ignore

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8
        run: flake8 --count --statistics vncdotool tests

  servers:
    name: Test server functional tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VNCDOTOOL_SCREENSHOT_DIR: screenshots
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt 'coverage>=7'
          # The functional suite shells out to `vncdo`, so it has to be on PATH.
          pip install -e .

      # A subprocess measures itself only if coverage starts before it
      # imports anything; see DEVELOP.rst.
      - name: Enable coverage in subprocesses
        run: |
          python - <<'PY'
          import pathlib, sysconfig
          pth = pathlib.Path(sysconfig.get_paths()["purelib"], "coverage-subprocess.pth")
          pth.write_text("import coverage; coverage.process_startup()\n")
          PY

      - name: Build and start the VNC test servers
        run: docker compose -f tests/servers/docker-compose.yml up -d --build --wait

      # The steps below are diagnostics and teardown, so they carry
      # `if: always()`: when a test fails, the container status, the
      # screenshot of what the server was actually showing, and the server
      # logs are exactly what's needed to debug it -- skipping them on
      # failure would throw away the evidence. `down` likewise has to run
      # whatever happened.
      - name: Show test server status
        if: always()
        run: docker compose -f tests/servers/docker-compose.yml ps

      - name: Run functional tests
        env:
          COVERAGE_PROCESS_START: ${{ github.workspace }}/setup.cfg
        run: coverage run --parallel-mode -m unittest discover -v -s tests/functional -t .

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-fleet
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Capture screenshots and build the gallery
        if: always()
        timeout-minutes: 3
        run: python tests/functional/capture_screenshots.py

      - name: Dump test server container logs
        if: always()
        run: docker compose -f tests/servers/docker-compose.yml logs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Stop the VNC test servers
        if: always()
        run: docker compose -f tests/servers/docker-compose.yml down

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, servers]
    permissions:
      contents: read
      pull-requests: write
    # Runs on a red build too, so a failing suite still reports what it
    # reached before it stopped.
    if: always()
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install coverage
        run: pip install 'coverage>=7'

      - name: Download unit tier coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-unit-*
          path: data/unit
          merge-multiple: true

      - name: Download fleet tier coverage data
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-fleet
          path: data/fleet

      - name: Report
        run: |
          .github/scripts/coverage-summary.sh unit=data/unit fleet=data/fleet
          cat combined/summary.md >> "$GITHUB_STEP_SUMMARY"

      # A fork's token is read-only, so this cannot post there. The job
      # summary carries the same numbers either way.
      - name: Comment on the pull request
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          {
            echo
            echo "Per-file detail in the [job summary]($RUN_URL), line by line in its \`coverage-html\` artifact."
          } >> combined/comment.md
          .github/scripts/pr-sticky-comment.sh coverage-summary "$PR_NUMBER" combined/comment.md
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Upload the annotated HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          if-no-files-found: ignore
