name: VNCDotool CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_PYTHON_VERSION_WARNING: '1'

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: [ubuntu-latest] #, windows-latest] tests fail on windows
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unittests
        run: python -m unittest discover tests/unit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8
        run: flake8 --count --statistics vncdotool tests

  functional:
    name: Functional tests (LibVNCServer)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install LibVNCServer build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libssl-dev zlib1g-dev

      - name: Cache LibVNCServer build
        uses: actions/cache@v4
        with:
          path: .vncdo
          key: libvncserver-${{ runner.os }}-${{ hashFiles('libvncserver.mk') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run functional tests against LibVNCServer examples
        run: make test-func

  servers:
    name: Test server functional tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VNCDOTOOL_SCREENSHOT_DIR: screenshots
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # GitHub-hosted runners start every job with an empty Docker layer
      # cache, so `up --build` rebuilds the images from scratch on every
      # run (~35s of local no-op work). Building through buildx with the
      # GitHub Actions cache backend (scoped to this repo, keyed by layer)
      # turns that into a cache hit whenever the Dockerfile and its build
      # context haven't changed, while still rebuilding correctly whenever
      # they have. `docker buildx bake` reads targets straight out of the
      # compose file, so there is exactly one definition of each image.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the VNC test server images (cached)
        uses: docker/bake-action@v5
        with:
          files: tests/servers/docker-compose.yml
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - name: Start the VNC test servers
        run: docker compose -f tests/servers/docker-compose.yml up -d --wait

      # The steps below are diagnostics and teardown, so they carry
      # `if: always()`: when a test fails, the container status, the
      # screenshot of what the server was actually showing, and the server
      # logs are exactly what's needed to debug it -- skipping them on
      # failure would throw away the evidence. `down` likewise has to run
      # whatever happened.
      - name: Show test server status
        if: always()
        run: docker compose -f tests/servers/docker-compose.yml ps

      - name: Run test server functional tests
        run: python -m unittest discover -v -s tests/functional -t . -p 'test_servers.py'

      - name: Capture screenshots and build the gallery
        if: always()
        timeout-minutes: 3
        run: python tests/functional/capture_screenshots.py

      - name: Dump test server container logs
        if: always()
        run: docker compose -f tests/servers/docker-compose.yml logs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Stop the VNC test servers
        if: always()
        run: docker compose -f tests/servers/docker-compose.yml down
