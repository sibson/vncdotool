name: VNCDotool CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: [ubuntu-latest] #, windows-latest] tests fail on windows
        python-version: ['3.10', '3.11', '3.12', '3.13']
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run unittests
        run: uv run coverage run --parallel-mode -m unittest discover tests/unit

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit-${{ matrix.python-version }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: ignore
          # A handoff to the coverage job minutes later, not a record: it is
          # read within the run and never again.
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run flake8
        run: uv run flake8 --count --statistics vncdotool tests

  servers:
    name: Test server functional tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      pull-requests: write
    env:
      VNCDOTOOL_SCREENSHOT_DIR: screenshots
      FLEET_IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/vncdotool-test
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Resolve the fleet image tag
        run: echo "FLEET_TAG=$(git rev-parse HEAD:tests/servers)" >> "$GITHUB_ENV"

      - name: Fetch or build the VNC test servers
        run: |
          if docker compose -f tests/servers/docker-compose.yml pull --quiet; then
            echo "FLEET_IMAGES_BUILT=false" >> "$GITHUB_ENV"
          else
            docker compose -f tests/servers/docker-compose.yml build
            echo "FLEET_IMAGES_BUILT=true" >> "$GITHUB_ENV"
          fi
          docker compose -f tests/servers/docker-compose.yml up -d --wait

      - name: Wait for the test servers to serve their screens
        timeout-minutes: 5
        run: uv run python tests/functional/wait_for_servers.py docker

      # Diagnostics and teardown. The container status and the server logs
      # are step output on the run page, so they cost nothing to keep and
      # run whatever happened, as `down` must. The screenshot gallery
      # becomes a stored artifact instead, so it is captured only when a
      # failure gives someone a reason to look at it.
      - name: Show test server status
        if: always()
        run: docker compose -f tests/servers/docker-compose.yml ps

      - name: Run functional tests
        run: uv run coverage run --parallel-mode -m unittest discover -v -s tests/functional -t .

      # Nothing but a failed image comparison creates this directory, so its
      # existence -- not `failure()`, which any other broken test also
      # satisfies -- is what decides whether there is an image to show.
      - name: Look for image comparison failures
        if: always()
        id: diffs
        run: test -d screenshots/failures && echo "found=true" >> "$GITHUB_OUTPUT" || true

      - name: Upload the failed image comparisons
        if: always() && steps.diffs.outputs.found == 'true'
        id: image-diffs
        uses: actions/upload-artifact@v4
        with:
          name: image-diffs
          path: screenshots/failures/

      # Forks get a read-only token, so the comment would fail rather than
      # be refused.
      - name: Comment on the pull request
        if: >
          always() && steps.diffs.outputs.found == 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          ARTIFACT_URL: ${{ steps.image-diffs.outputs.artifact-url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo "### Image comparisons failed"
            echo
            echo "| comparison | difference |"
            echo "| --- | --- |"
            for report in screenshots/failures/*/; do
              echo "| \`$(basename "$report")\` | $(cat "$report/summary.txt") |"
            done
            echo
            echo "The captured image, the oracle it was compared against and their amplified"
            echo "difference are in [the \`image-diffs\` artifact]($ARTIFACT_URL); open"
            echo "\`index.html\` from it to see all three side by side."
            echo
            echo "From \`$HEAD_SHA\`, [run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          } > image-diffs.md
          gh pr comment "$PR" --body-file image-diffs.md --edit-last --create-if-none

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-fleet
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Capture screenshots and build the gallery
        if: failure()
        timeout-minutes: 3
        run: uv run python tests/functional/capture_screenshots.py

      - name: Dump test server container logs
        if: always()
        run: docker compose -f tests/servers/docker-compose.yml logs

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            screenshots/
            !screenshots/failures/
          if-no-files-found: ignore

      - name: Stop the VNC test servers
        if: always()
        run: docker compose -f tests/servers/docker-compose.yml down --timeout 2

      # Last, and without `if: always()`: a fleet reaches the registry only
      # after passing the suite it exists to serve.
      - name: Log in to GHCR
        if: env.FLEET_IMAGES_BUILT == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the fleet images
        if: env.FLEET_IMAGES_BUILT == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker compose -f tests/servers/docker-compose.yml push
          {
            echo "Published \`$FLEET_TAG\`:"
            echo
            docker compose -f tests/servers/docker-compose.yml config --images | sort -u | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, servers]
    # Runs on a red build too, so a failing suite still reports what it
    # reached before it stopped.
    if: always()
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Download unit tier coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-unit-*
          path: data/unit
          merge-multiple: true

      - name: Download fleet tier coverage data
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-fleet
          path: data/fleet

      - name: Report
        run: |
          uv run .github/scripts/coverage-summary.sh unit=data/unit fleet=data/fleet
          cat combined/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the annotated HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          if-no-files-found: ignore

      - name: Upload unit coverage to Codecov
        if: always() && env.CODECOV_TOKEN != ''
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          files: combined/xml/unit.xml
          flags: unit
          disable_search: true
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload fleet coverage to Codecov
        if: always() && env.CODECOV_TOKEN != ''
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          files: combined/xml/fleet.xml
          flags: fleet
          disable_search: true
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
