name: Spike - VNC server fleet

on:
  push:
    branches:
      - claude/spike-server-fleet
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_PYTHON_VERSION_WARNING: '1'

defaults:
  run:
    shell: bash

jobs:
  fleet:
    name: Fleet functional tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build and start the VNC server fleet
        run: |
          docker compose -f tests/servers/docker-compose.yml up -d --build --wait

      - name: Show fleet status
        if: always()
        run: docker compose -f tests/servers/docker-compose.yml ps

      - name: Run fleet functional tests
        run: |
          mkdir -p fleet-screenshots
          python -m unittest discover -v -s tests/functional -t . -p 'test_fleet.py'

      - name: Capture fleet screenshots for the artifact upload
        if: always()
        run: |
          python - <<'PY'
          import socket
          import sys

          sys.path.insert(0, "tests/functional")
          from test_fleet import FLEET_SERVERS  # noqa: E402

          from vncdotool import api  # noqa: E402

          for server in FLEET_SERVERS:
              dest = f"fleet-screenshots/{server.name}.png"
              try:
                  with socket.create_connection(("127.0.0.1", server.port), timeout=1):
                      pass
              except OSError:
                  print(f"skip {server.name}: port {server.port} not open")
                  continue
              try:
                  with api.connect(f"127.0.0.1::{server.port}", password=server.password) as client:
                      client.timeout = 5
                      client.captureScreen(dest)
                  print(f"captured {dest}")
              except Exception as exc:  # noqa: BLE001 - best effort artifact capture
                  print(f"failed to capture {server.name}: {exc}")
          PY

      - name: Dump fleet container logs
        if: always()
        run: docker compose -f tests/servers/docker-compose.yml logs

      - name: Upload fleet screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-screenshots
          path: fleet-screenshots/
          if-no-files-found: ignore

      - name: Stop the VNC server fleet
        if: always()
        run: docker compose -f tests/servers/docker-compose.yml down
