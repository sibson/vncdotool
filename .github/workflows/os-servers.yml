name: OS-hosted VNC servers

# Live, OS-bound VNC servers (UltraVNC on Windows, Apple Screen Sharing on
# macOS, raw QEMU/KVM on Linux) -- see specs/server-compatibility-plan.md,
# Tier 2. These are the only place UltraVNC and Screen Sharing compatibility,
# and QEMU's KVM-accelerated path, can be exercised live, so this job runs
# on real changes rather than never, but it is deliberately change-triggered
# (path-filtered, no schedule).
#
# What each server needs, and what it does and doesn't prove, is documented
# in tests/servers/ultravnc/README.md, tests/servers/screen-sharing/README.md,
# and tests/servers/qemu-kvm/README.md.

on:
  push:
    branches:
      - main
    paths:
      - 'vncdotool/**'
      - 'tests/functional/**'
      - 'tests/servers/ultravnc/**'
      - 'tests/servers/screen-sharing/**'
      - 'tests/servers/qemu-kvm/**'
      - '.github/workflows/os-servers.yml'
      - '.github/actions/os-server/**'
  pull_request:
    paths:
      - 'vncdotool/**'
      - 'tests/functional/**'
      - 'tests/servers/ultravnc/**'
      - 'tests/servers/screen-sharing/**'
      - 'tests/servers/qemu-kvm/**'
      - '.github/workflows/os-servers.yml'
      - '.github/actions/os-server/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  VNCDOTOOL_SCREENSHOT_DIR: screenshots

jobs:
  os-server:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      # One OS failing must never take down the other: each is a separate
      # data point about that OS, not a step in a shared pipeline.
      fail-fast: false
      matrix:
        include:
          - name: Windows - UltraVNC
            runner: windows-latest
            shell: pwsh
            os: windows
            server: ultravnc
            diagnostics: ./tests/servers/ultravnc/collect-diagnostics.ps1
          - name: macOS - Screen Sharing
            runner: macos-latest
            shell: bash
            os: macos
            server: screen-sharing
            diagnostics: bash tests/servers/screen-sharing/collect-diagnostics.sh
          - name: Linux - QEMU/KVM
            runner: ubuntu-latest
            shell: bash
            os: linux
            server: qemu-kvm
            diagnostics: bash tests/servers/qemu-kvm/collect-diagnostics.sh
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install vncdotool
        run: uv sync

      # A spike credential for a throwaway runner, deliberately visible as the
      # fallback; a repo secret replaces it.
      - name: Set up the VNC server
        uses: ./.github/actions/os-server
        with:
          os: ${{ matrix.os }}
          password: ${{ secrets.VNC_OS_SERVER_PASSWORD || 'vncspike1' }}

      # An open port is not readiness: the first connection to macOS Screen
      # Sharing is what starts it, and that connection can stall for good
      # while the next one succeeds immediately.
      - name: Wait for the server to serve a screen
        run: uv run python tests/functional/wait_for_servers.py os

      # Temporary: measures whether UltraVNC/Screen Sharing pick Tight when
      # it is the only encoding offered (specs/decoder-architecture.md's
      # unmeasured Tier 2 cells). No decoder exists for Tight yet, so if the
      # server uses it, rfb.py's "unknown encoding received" path logs that
      # and disconnects -- itself the positive result. A clean capture with
      # no such line is a negative. Revert this step and the "tight" entry
      # in vncdotool/decoders/__init__.py once the table cites the run.
      - name: Probe Tight support (UltraVNC)
        if: matrix.server == 'ultravnc'
        continue-on-error: true
        run: uv run vncdo -v --encodings tight -s 127.0.0.1::5900 -p "$env:VNCDOTOOL_OS_SERVER_PASSWORD" capture tight-probe.png

      - name: Probe Tight support (Screen Sharing)
        if: matrix.server == 'screen-sharing'
        continue-on-error: true
        run: >-
          uv run vncdo -v --encodings tight -s 127.0.0.1::5900
          -p "$VNCDOTOOL_OS_SERVER_PASSWORD" -u "$VNCDOTOOL_OS_SERVER_USERNAME"
          capture tight-probe.png

      - name: Run OS server functional tests
        run: uv run python -m unittest discover -v -s tests/functional -t . -p 'test_server_compat_native.py'

      # Everything below is diagnostics and artifact collection, so it runs
      # with if: failure() -- a failing test is exactly when the screenshot
      # and the server's own logs are worth having, and a green run has
      # nobody to read them. The steps above are the test itself and
      # deliberately stop the job when they fail.
      - name: Capture screenshots and build the gallery
        if: failure()
        timeout-minutes: 3
        run: uv run python tests/functional/capture_screenshots.py os

      - name: Collect server diagnostics
        if: failure()
        run: ${{ matrix.diagnostics }}

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.server }}-screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.server }}-diagnostics
          path: diagnostics/
          if-no-files-found: ignore
